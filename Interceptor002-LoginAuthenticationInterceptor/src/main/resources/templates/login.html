<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<title>Login</title>


<style>
body {
	font-family: Arial, sans-serif;
}

h2 {
	color: green;
	text-align: center;
	font-size: 30px;
}

label {
	color: blue;
	font-size: 18px;
	font-weight: bold;
}

input {
	color: purple;
	font-size: 16px;
	border: 1px solid gray;
	padding: 6px;
}

button {
	color: white;
	background-color: royalblue;
	border: none;
	padding: 8px 18px;
	font-size: 16px;
	cursor: pointer;
}

button:hover {
	background-color: dodgerblue;
}

p {
	color: brown;
	text-align: center;
	font-size: 20px;
}

.username {
	color: orange;
	font-weight: bold;
}

.error {
	color: red;
	font-weight: bold;
	text-align: center;
}

</style>

</head>

<body>

	<div class="login-container">

		<h2>Login Page</h2>

		<form th:action="@{/login}" method="post">

			<div class="form-group">
				<label for="username">Username</label> <input type="text"
					id="username" name="username" placeholder="Enter username" required>
			</div>

			<div class="form-group">
				<label for="password">Password</label> <input type="password"
					id="password" name="password" placeholder="Enter password" required>
			</div>

			<button class="login-button" type="submit">Login</button>

		</form>

		<p class="error-message" th:if="${error}" th:text="${error}"></p>

	</div>

</body>
</html>
